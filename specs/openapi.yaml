openapi: 3.0.3
info:
  title: Evelyn Multiverse Storytelling API
  description: |
    API para la plataforma Evelyn de storytelling multiverso.
    Cada mundo de juego es único y efímero, permitiendo experiencias narrativas dinámicas.
  version: 1.0.0
  contact:
    name: Evelyn Team
    email: dev@evelyn-multiverse.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: Servidor de desarrollo local
  - url: https://api.evelyn-multiverse.com
    description: Servidor de producción

paths:
  /worlds:
    get:
      summary: Listar mundos disponibles
      description: Obtiene una lista de todos los mundos de storytelling disponibles
      tags:
        - Worlds
      parameters:
        - name: limit
          in: query
          description: Número máximo de mundos a retornar
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Número de mundos a omitir
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Lista de mundos obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  worlds:
                    type: array
                    items:
                      $ref: '#/components/schemas/World'
                  total:
                    type: integer
                    description: Número total de mundos disponibles
                  limit:
                    type: integer
                  offset:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Crear nuevo mundo
      description: Crea un nuevo mundo de storytelling efímero
      tags:
        - Worlds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldCreateRequest'
      responses:
        '201':
          description: Mundo creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/World'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /worlds/{world_id}:
    get:
      summary: Obtener mundo específico
      description: Obtiene los detalles de un mundo específico
      tags:
        - Worlds
      parameters:
        - name: world_id
          in: path
          required: true
          description: ID único del mundo
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalles del mundo obtenidos exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/World'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Actualizar mundo
      description: Actualiza los detalles de un mundo existente
      tags:
        - Worlds
      parameters:
        - name: world_id
          in: path
          required: true
          description: ID único del mundo
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldUpdateRequest'
      responses:
        '200':
          description: Mundo actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/World'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Eliminar mundo
      description: Elimina un mundo y todos sus datos asociados
      tags:
        - Worlds
      parameters:
        - name: world_id
          in: path
          required: true
          description: ID único del mundo
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Mundo eliminado exitosamente
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /worlds/{world_id}/stories:
    get:
      summary: Listar historias del mundo
      description: Obtiene todas las historias asociadas a un mundo específico
      tags:
        - Stories
      parameters:
        - name: world_id
          in: path
          required: true
          description: ID único del mundo
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filtrar por estado de la historia
          required: false
          schema:
            type: string
            enum: [draft, published, archived]
        - name: limit
          in: query
          description: Número máximo de historias a retornar
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Lista de historias obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  stories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Story'
                  total:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Crear nueva historia
      description: Crea una nueva historia en el mundo especificado
      tags:
        - Stories
      parameters:
        - name: world_id
          in: path
          required: true
          description: ID único del mundo
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryCreateRequest'
      responses:
        '201':
          description: Historia creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Story'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    World:
      type: object
      required:
        - id
        - name
        - description
        - created_at
        - expires_at
        - status
      properties:
        id:
          type: string
          format: uuid
          description: ID único del mundo
        name:
          type: string
          description: Nombre del mundo
          maxLength: 100
        description:
          type: string
          description: Descripción detallada del mundo
          maxLength: 1000
        settings:
          type: object
          description: Configuraciones específicas del mundo
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          description: Fecha y hora de creación
        expires_at:
          type: string
          format: date-time
          description: Fecha y hora de expiración del mundo
        status:
          type: string
          enum: [active, paused, expired]
          description: Estado actual del mundo

    WorldCreateRequest:
      type: object
      required:
        - name
        - description
        - expires_at
      properties:
        name:
          type: string
          description: Nombre del mundo
          maxLength: 100
        description:
          type: string
          description: Descripción detallada del mundo
          maxLength: 1000
        settings:
          type: object
          description: Configuraciones específicas del mundo
          additionalProperties: true
        expires_at:
          type: string
          format: date-time
          description: Fecha y hora de expiración del mundo

    WorldUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Nombre del mundo
          maxLength: 100
        description:
          type: string
          description: Descripción detallada del mundo
          maxLength: 1000
        settings:
          type: object
          description: Configuraciones específicas del mundo
          additionalProperties: true
        expires_at:
          type: string
          format: date-time
          description: Fecha y hora de expiración del mundo

    Story:
      type: object
      required:
        - id
        - world_id
        - title
        - content
        - created_at
        - status
      properties:
        id:
          type: string
          format: uuid
          description: ID único de la historia
        world_id:
          type: string
          format: uuid
          description: ID del mundo al que pertenece
        title:
          type: string
          description: Título de la historia
          maxLength: 200
        content:
          type: string
          description: Contenido de la historia
        metadata:
          type: object
          description: Metadatos adicionales de la historia
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          description: Fecha y hora de creación
        updated_at:
          type: string
          format: date-time
          description: Fecha y hora de última actualización
        status:
          type: string
          enum: [draft, published, archived]
          description: Estado de la historia

    StoryCreateRequest:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          description: Título de la historia
          maxLength: 200
        content:
          type: string
          description: Contenido de la historia
        metadata:
          type: object
          description: Metadatos adicionales de la historia
          additionalProperties: true

  responses:
    BadRequest:
      description: Solicitud incorrecta
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Descripción del error
              details:
                type: object
                description: Detalles adicionales del error

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Descripción del error

    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Descripción del error

tags:
  - name: Worlds
    description: Operaciones relacionadas con mundos de storytelling
  - name: Stories
    description: Operaciones relacionadas con historias dentro de mundos
